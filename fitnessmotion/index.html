<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FitnessMotion</title>
<link rel="stylesheet" href="styles.css?v=7" onerror="window.__fmStatus && window.__fmStatus('styles.css failed to load')">
<div id="app"></div>
<div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;color:#fff;font:600 27px -apple-system,Roboto,system-ui,sans-serif;z-index:100">
  <div class="wordmark"><span class="logo"><i class="a"></i><i class="b"></i><i class="c"></i></span><span>Fitness<span class="m" style="color:#3f8dff">Motion</span></span></div>
  <div class="bar"><i></i></div>
  <div id="loadmsg" style="max-width:320px;text-align:center;color:#9a9da8;font:14px -apple-system,Roboto,system-ui,sans-serif;padding:0 16px">Loading the 3D body…</div>
</div>
<script>
  window.__fmStatus = function (t) { var m = document.getElementById('loadmsg'); if (m) m.textContent = t; };
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : '';
    window.__fmStatus('Error: ' + (e.message || e.type) + where);
  });
  window.addEventListener('unhandledrejection', function (e) { window.__fmStatus('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
</script>
<script type="module" src="js/app.js?v=7" onerror="window.__fmStatus('js/app.js failed to load')"></script>

</body></html>
