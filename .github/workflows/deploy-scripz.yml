name: Deploy Scripz to GitHub Pages

on:
  push:
    branches:
      - claude/scripz-domain-migration-nkjgg5
    paths:
      - "scripz/**"
      - ".github/workflows/deploy-scripz.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripz-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripz/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        # Relative asset URLs (vite.config.ts): the build works under any repo name or domain.
        run: npm run build

      # GitHub Pages publishes the gh-pages branch. The build output replaces the
      # branch content on every deploy (the branch holds no source, only the site).
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Scripz ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
