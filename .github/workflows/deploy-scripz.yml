name: Deploy Scripz to GitHub Pages

on:
  push:
    branches:
      - claude/scripz-domain-migration-nkjgg5
    paths:
      - "scripz/**"
      - ".github/workflows/deploy-scripz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scripz-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripz/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        env:
          # Project sites live under https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripz/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # A dedicated environment: the auto-created "github-pages" one only allows the default branch.
    environment:
      name: scripz-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
